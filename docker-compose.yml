services:
  mysql:
    image: mysql:8.0
    container_name: outsmartai-mysql
    restart: unless-stopped
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:-outsmartai_dev_root}"
      MYSQL_DATABASE: "${MYSQL_DATABASE:-outsmartai}"
      MYSQL_USER: "${MYSQL_USER:-outsmartai}"
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:-outsmartai_dev_password}"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mysql_data:
