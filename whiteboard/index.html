<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OutSmartAI Login</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login" class="ux-page">
  <main class="auth-layout">
    <section class="auth-panel" aria-labelledby="login-title">
      <p class="eyebrow">OutSmartAI</p>
      <h1 id="login-title">Sign in</h1>
      <p class="muted-copy">Welcome back.</p>

      <div class="auth-tabs" role="tablist" aria-label="Authentication mode">
        <button type="button" class="auth-tab active" data-auth-mode="login">Login</button>
        <button type="button" class="auth-tab" data-auth-mode="register">Create account</button>
      </div>

      <form id="loginForm" class="stacked-form" autocomplete="on">
        <label>
          Username
          <input id="loginUsername" name="username" autocomplete="username" required>
        </label>
        <label>
          Password
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit">Login</button>
      </form>

      <form id="registerForm" class="stacked-form hidden" autocomplete="on">
        <label>
          Username
          <input id="registerUsername" name="username" autocomplete="username" required minlength="3">
        </label>
        <label>
          Display name
          <input id="registerDisplayName" name="display_name" autocomplete="name">
        </label>
        <label>
          Email
          <input id="registerEmail" name="email" type="email" autocomplete="email">
        </label>
        <label>
          Password
          <input id="registerPassword" name="password" type="password" autocomplete="new-password" required minlength="8">
        </label>
        <button type="submit">Create account</button>
      </form>

      <p id="authMessage" class="form-message" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="ux.js"></script>
</body>
</html>
